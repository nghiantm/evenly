<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/evenly-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evenly — Expense Workspace</title>
    <meta name="description" content="Evenly — split expenses fairly across groups." />
    <!-- Force Chakra UI into dark mode before React hydrates to prevent flash -->
    <script>
      (function () {
        try {
          localStorage.setItem('chakra-ui-color-mode', 'dark');
        } catch (_) {}
        document.documentElement.style.background = '#0d1117';
        document.documentElement.style.color = '#e6edf3';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0d1117; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
